server:
  port: 8081

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: Auth
    urls:
      - name: Auth
        url: /v3/api-docs/auth
      - name: Tenant
        url: /v3/api-docs/tenant
      - name: Catalog
        url: /v3/api-docs/catalog
      - name: Inventory
        url: /v3/api-docs/inventory
      - name: Order
        url: /v3/api-docs/order
      - name: Integration
        url: /v3/api-docs/integration
      - name: AI
        url: /v3/api-docs/ai

spring:
  application:
    name: smartomni-service-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    username: smartomni_app
    password: ${DB_APP_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    user: smartomni_migrator
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: public
    table: flyway_schema_history
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

smartomni:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24h
    refresh-expiration-ms: 604800000  # 7 days (7 * 24 * 3600 * 1000)
  tenant:
    base-domain: ${BASE_DOMAIN:smartomni.vn}
    reserved-subdomains:
      - admin
      - api
      - auth
      - app
      - www
      - static
      - mail

logging:
  level:
    com.smartomni: DEBUG
