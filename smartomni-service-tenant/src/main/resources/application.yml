server:
  port: 8082

spring:
  application:
    name: smartomni-service-tenant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    username: smartomni_app
    password: ${DB_APP_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    user: smartomni_migrator
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: public
    table: flyway_schema_history
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

logging:
  level:
    com.smartomni: DEBUG

smartomni:
  jwt:
    secret: ${JWT_SECRET}
  tenant:
    base-domain: ${BASE_DOMAIN:smartomni.vn}
    supported-base-domains:
      - smartomni.vn
      - lvh.me
      - smartomni.local
      - localhost
    reserved-subdomains:
      - admin
      - api
      - auth
      - app
      - www
      - static
      - mail

app:
  domain-pattern: ${APP_DOMAIN_PATTERN:https://{slug}.smartomni.vn}

sepay:
  enabled: ${SEPAY_ENABLED:true}
  account-number: ${SEPAY_ACCOUNT_NUMBER:0000000001}
  bank-id: ${SEPAY_BANK_ID:MBBank}
  account-holder: ${SEPAY_ACCOUNT_HOLDER:HO KINH DOANH SmartOmni}
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:test_sepay_secret_key_123}
  pro-plan-price: ${SEPAY_PRO_PRICE:499000.00}
  qr-template: ${SEPAY_QR_TEMPLATE:compact}
