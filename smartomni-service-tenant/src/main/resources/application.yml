server:
  port: 8082

spring:
  application:
    name: smartomni-service-tenant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    username: smartomni_app
    password: ${DB_APP_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    user: smartomni_migrator
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: public
    table: flyway_schema_history
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

logging:
  level:
    com.smartomni: DEBUG

smartomni:
  jwt:
    secret: ${JWT_SECRET}
  tenant:
    base-domain: ${BASE_DOMAIN:smartomni.vn}
    reserved-subdomains:
      - admin
      - api
      - auth
      - app
      - www
      - static
      - mail
