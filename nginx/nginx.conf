events {}

http {
    server {
        listen 8080 default_server;
        server_name ~^(?<subdomain>[a-z0-9-]+)\.smartomni\.vn$ _;

        client_max_body_size 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $subdomain;
        # Only a verified JWT inside each Java service may establish tenant context.
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-User-Role "";

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location ^~ /internal/ { return 404; }

        # Swagger UI and service OpenAPI documents.
        location = /swagger-ui.html { proxy_pass http://auth-service:8081; }
        location ^~ /swagger-ui/ { proxy_pass http://auth-service:8081; }
        location = /v3/api-docs { proxy_pass http://auth-service:8081; }
        location = /v3/api-docs/swagger-config { proxy_pass http://auth-service:8081; }
        location = /v3/api-docs/auth { proxy_pass http://auth-service:8081/v3/api-docs; }
        location = /v3/api-docs/tenant { proxy_pass http://tenant-service:8082/v3/api-docs; }
        location = /v3/api-docs/catalog { proxy_pass http://catalog-service:8083/v3/api-docs; }
        location = /v3/api-docs/inventory { proxy_pass http://inventory-service:8084/v3/api-docs; }
        location = /v3/api-docs/order { proxy_pass http://order-service:8085/v3/api-docs; }
        location = /v3/api-docs/integration { proxy_pass http://integration-service:8086/v3/api-docs; }
        location = /v3/api-docs/ai { proxy_pass http://ai-service:8087/v3/api-docs; }

        # API V1 Routes
        location ^~ /api/v1/auth/ { proxy_pass http://auth-service:8081; }
        location ^~ /api/v1/users/ { proxy_pass http://auth-service:8081; }
        location ^~ /api/v1/tenants/ { proxy_pass http://tenant-service:8082; }
        location ^~ /api/v1/subscription-plans/ { proxy_pass http://tenant-service:8082; }
        location ^~ /api/v1/support-tickets/ { proxy_pass http://tenant-service:8082; }
        location ^~ /api/v1/products/ { proxy_pass http://catalog-service:8083; }
        location ^~ /api/v1/promotions/ { proxy_pass http://catalog-service:8083; }
        location ^~ /api/v1/price-sync/ { proxy_pass http://catalog-service:8083; }
        location ^~ /api/v1/inventory/ { proxy_pass http://inventory-service:8084; }
        location ^~ /api/v1/orders/ { proxy_pass http://order-service:8085; }
        location ^~ /api/v1/returns/ { proxy_pass http://order-service:8085; }
        location ^~ /api/v1/marketplace-connections/ { proxy_pass http://integration-service:8086; }
        location ^~ /api/v1/integrations/ { proxy_pass http://integration-service:8086; }
        location ^~ /api/v1/tiktok/ { proxy_pass http://integration-service:8086; }
        location ^~ /api/v1/ai/ { proxy_pass http://ai-service:8087; }

        # Legacy / Unversioned API Routes
        location ^~ /api/auth/ { proxy_pass http://auth-service:8081; }
        location ^~ /api/users/ { proxy_pass http://auth-service:8081; }
        location ^~ /api/tenants/ { proxy_pass http://tenant-service:8082; }
        location ^~ /api/subscription-plans/ { proxy_pass http://tenant-service:8082; }
        location ^~ /api/support-tickets/ { proxy_pass http://tenant-service:8082; }
        location ^~ /api/products/ { proxy_pass http://catalog-service:8083; }
        location ^~ /api/promotions/ { proxy_pass http://catalog-service:8083; }
        location ^~ /api/price-sync/ { proxy_pass http://catalog-service:8083; }
        location ^~ /api/inventory/ { proxy_pass http://inventory-service:8084; }
        location ^~ /api/orders/ { proxy_pass http://order-service:8085; }
        location ^~ /api/returns/ { proxy_pass http://order-service:8085; }
        location ^~ /api/marketplace-connections/ { proxy_pass http://integration-service:8086; }
        location ^~ /api/tiktok/ { proxy_pass http://integration-service:8086; }
        location ^~ /webhook/ { proxy_pass http://integration-service:8086; }
        location ^~ /api/ai/ { proxy_pass http://ai-service:8087; }

        # Spring controllers also accept their base path without a trailing slash.
        location = /api/v1/auth { proxy_pass http://auth-service:8081; }
        location = /api/v1/users { proxy_pass http://auth-service:8081; }
        location = /api/v1/tenants { proxy_pass http://tenant-service:8082; }
        location = /api/auth { proxy_pass http://auth-service:8081; }
        location = /api/users { proxy_pass http://auth-service:8081; }
        location = /api/tenants { proxy_pass http://tenant-service:8082; }
        location = /api/subscription-plans { proxy_pass http://tenant-service:8082; }
        location = /api/support-tickets { proxy_pass http://tenant-service:8082; }
        location = /api/products { proxy_pass http://catalog-service:8083; }
        location = /api/promotions { proxy_pass http://catalog-service:8083; }
        location = /api/price-sync { proxy_pass http://catalog-service:8083; }
        location = /api/inventory { proxy_pass http://inventory-service:8084; }
        location = /api/orders { proxy_pass http://order-service:8085; }
        location = /api/returns { proxy_pass http://order-service:8085; }
        location = /api/marketplace-connections { proxy_pass http://integration-service:8086; }
        location = /api/v1/tiktok { proxy_pass http://integration-service:8086; }
        location = /api/tiktok { proxy_pass http://integration-service:8086; }
        location = /api/ai { proxy_pass http://ai-service:8087; }

        location / { return 404; }
    }
}
